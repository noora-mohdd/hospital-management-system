<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/hospital mgmt sys/static/style.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
    
    <div class="card p-4 shadow" style="background-color: #e3fcf9; width: 1000px;">

        <!--welcome doctor part from wireframe-->
        <div class="d-flex align-items-center w-100 justify-content-between">
            <h4 class="text-dark fw-bold">Welcome Dr. BADABING</h4>  
            <!--replace name w jinja later from db-->
            <button class="btn btn-outline-secondary" href="#">Logout</button>
        </div>

        <h5 class="mt-4">Upcoming Appointments</h5>
        <div class="table-responsive mt-4">
            <table class="table" style="border: 2px solid black; border-radius: 6px;">
                <thead>
                    <tr>
                        <th>Sr.No.</th>
                        <th>Patient Name</th>
                        <th>Patient History</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <!--sample row until backend-->
                <tbody>
                    <td>101</td>
                    <td>Mr. DUMFUKKS</td>
                    <td><button type="button" class="btn btn-primary">Update</button>  </td>
                    <td><button type="button" class="btn btn-outline-success">Mark as complete</button>
                        <button type="button" class="btn btn-outline-danger">Cancel</button>
                    </td>
                </tbody>
            </table>
        </div>

        <!--assigned patients part-->
        <div class="d-flex align-items-center justify-content-between mt-4">
            <h5>Assigned Patients</h5>
        </div>

        <!--assigned patient list-->
        <div class="card mt-3 p-2">

         <!--patient row-->
        <!--connect thru jinja later so we dontn have to hardcode and can go thru the docs admin registered from db-->
            <div class="d-flex align-items-center justify-content-between mt-2" style="border: 2px solid black; border-radius: 6px; padding: 10px;">
                <h6>Ms. DUMBFUKS</h6>
                <div class="d-flex gap-2"> <!--gap gives space b/w buttons-->
                    <button type="button" class="btn btn-outline-primary" href="#">View</button>  <!--patient edit form ig-->
                </div>
            </div>

        </div>

        <!--provide availability button-->
        <div class="text-end mt-4">
            <button type="button" class="btn btn-success">Provide availability</button>
        </div>







    </div>
