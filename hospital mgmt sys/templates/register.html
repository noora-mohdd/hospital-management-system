<!DOCTYPE html>
<html lang="en">

<head>
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/hospital mgmt sys/static/style.css">
    <style>
        #form-body form div{
            margin-bottom: 15px;
        }
        #form-body{
        height: 475px;
        width: 500px;
        border: 2px solid lightcyan;
        border-radius: 13px;
        position: relative;
        margin: 0 auto;
        top: 20vh;
        background-color: #e3fcf9;
        }
    </style>
</head>

<body>
    <div id="main">
        <h1>MediCare</h1>
        <div id="form-body">
            <h2>SIGN UP</h2>
            <form action="", method="post">
                <div>
                    <label for="uname", class="form-label">Username</label> <br>
                    <input type="text" class="form-control" id="uname"name="username" placeholder="type username">
                </div>
                <div>
                    <label for="email", class="form-label">E-mail ID</label> <br>
                    <input type="text" class="form-control" id="email" name="Email" placeholder="type valid E-mail">
                </div>
            
                <div>
                    <label for="pass", class="form-label">Password</label> <br>
                    <input type="password" class="form-control" id="pass" name="password" placeholder="type password">
                </div>
                <div class="text-center" style="margin-top: 25px;">
                    <input type="submit" class="btn btn-primary" value="Sign up"> <br>
                    <p class="mt-3">existing user? <a href="/hospital mgmt sys/templates/login.html"> Login</a></p>

                </div>
            </form>
        </div>
    </div>
</body>
</html>
