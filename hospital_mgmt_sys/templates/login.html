<!DOCTYPE html>
<html lang="en">

<head>
    <title>Login Page</title>
    <!--boostrap stylesheet-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!--link with jinja2 here-->
</head>

<body class="d-flex justify-content-center align-items-center vh-100">
    
    <!--form body-->
    <div class="card p-4 shadow" style="background-color: #e3fcf9; width: 28rem;">

        {% with messages=get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissable fade show d-flex justify-content-between align-items-center">
                        <span>{{ message }} </span> 
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"></script>
        

        <h2 class="text-center mb-4">LOGIN</h2>
        <form action="{{ url_for('patient.login') }}" method="post">

            <!--username field-->
            <div class="mb-3">
                <label class="form-label">Username</label> <br>
                <input type="text" class="form-control" name="username" placeholder="type username">
            </div>
            
            <!--password field-->
            <div class="mb-3">
                <label class="form-label">Password</label> <br>
                <input type="password" class="form-control" name="password" placeholder="type password">
            </div>

            <!--submit button-->
            <div class="text-center">
                <input type="submit" class="btn btn-primary w-100 mt-3" value="Login"> <br>
                <p class="mt-3">new user? <a href="{{ url_for('patient.register') }}">sign up</a></p>
            </div>

        </form>
    </div>
</body>
</html>
