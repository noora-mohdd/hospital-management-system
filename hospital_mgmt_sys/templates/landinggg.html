{% extends "base.html" %}
{% block content %}

<style>
    .hero-bg {
        background-image: url('{{ url_for("static", filename="img.jpeg") }}');
        background-size: cover;
        background-position: center;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: white;
        text-shadow: 0px 0px 10px rgba(0,0,0,0.5);
    }

    .hero-title {
        font-size: 3.5rem;
        font-weight: bold;
    }

    .hero-subtitle {
        font-size: 1.4rem;
        margin-top: 10px;
    }
</style>

<div class="hero-bg">
    <div>
        <h1 class="hero-title">MediCare</h1>
        <p class="hero-subtitle">Your trusted hospital appointment system</p>
    </div>
</div>

{% endblock %}
