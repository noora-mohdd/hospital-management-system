<!DOCTYPE html>
<html lang="en">

<head>
    <title>Add Doctor</title>
    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4 shadow" style="width: 30rem; background-color: #e3fcf9">
        <h2 class="text-center mb-4">Add Doctor</h2>
        <form action="{{ url_for('admin.create_doctor')}}" method="post">

            <!--full name-->
             <div class="mb-3">
                <label class="form-label">Full Name</label> <br>
                <input type="text" class="form-control" name="full_name" placeholder="doctor name">
            </div>

            <!--Specialization-->
            <div class="mb-3">
                <label class="form-label">Specialization</label> <br>
                <input type="text" class="form-control" name="specialization" placeholder="Department name">
            </div>

            <!--Email-->
            <div class="mb-3">
                <label class="form-label">Email</label> <br>
                <input type="email" class="form-control" name="email" placeholder="Email ID">
            </div>

            <!--password-->
            <div class="mb-3">
                <label class="form-label">Password</label> <br>
                <input type="password" class="form-control" name="password" required>
            </div>

            <!--experience-->
            <div class="mb-3">
                <label class="form-label">Experience</label> <br>
                <input type="number" class="form-control" name="experience" placeholder="eg:10">
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-success">create</button>
            </div>
            </form>
        </div>
    </div>
</body>
</html>
