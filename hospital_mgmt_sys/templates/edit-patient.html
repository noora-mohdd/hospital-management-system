<!DOCTYPE html>
<html lang="en">

<head>
    <title>Edit patient</title>
    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4 shadow" style="width: 30rem; background-color: #e3fcf9">

        {% with messages=get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissable fade show d-flex justify-content-between align-items-center">
                        <span>{{ message }} </span> 
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"></script>


        <h2 class="text-center mb-4">Edit patient</h2>
        <form action="{{ url_for('admin.edit_patient', id=patient.id) }}" method="post">

            <!--full name-->
             <div class="mb-3">
                <label class="form-label">Full Name</label> <br>
                <input type="text" class="form-control" name="full_name" placeholder="doctor name" value="{{ patient.full_name }}" required>
            </div>

            <!--age-->
            <div class="mb-3">
                <label class="form-label">Age</label> <br>
                <input type="number" class="form-control" name="age" placeholder="age" value="{{ patient.age }}" required>
            </div>

            <!--Email-->
            <div class="mb-3">
                <label class="form-label">Email</label> <br>
                <input type="email" class="form-control" name="email" placeholder="Email ID" value="{{ patient.email }}" required>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-success">Edit</button>
            </div>
            </form>
        </div>
    </div>
</body>
</html>
