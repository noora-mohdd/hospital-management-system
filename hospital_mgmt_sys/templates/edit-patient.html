<!DOCTYPE html>
<html lang="en">

<head>
    <title>Edit patient</title>
    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/hospital_mgmt_sys/static/style.css">
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4 shadow" style="width: 30rem; background-color: #e3fcf9">
        <h2 class="text-center mb-4">Edit patient</h2>
        <form action="#" method="post">

            <!--full name-->
             <div class="mb-3">
                <label class="form-label">Full Name</label> <br>
                <input type="text" class="form-control" name="Full Name" placeholder="doctor name">
            </div>

            <!--Specialization-->
            <div class="mb-3">
                <label class="form-label">Age</label> <br>
                <input type="number" class="form-control" name="Department" placeholder="Department name">
            </div>

            <!--Email-->
            <div class="mb-3">
                <label class="form-label">Email</label> <br>
                <input type="email" class="form-control" name="email" placeholder="Email ID">
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-success">Edit</button>
            </div>
            </form>
        </div>
    </div>
</body>
</html>
