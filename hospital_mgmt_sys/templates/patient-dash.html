<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/hospital mgmt sys/static/style.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="width: 55rem; background-color: #e3fcf9">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold">Welcome BEBOP</h4>

            <div class="d-flex gap-2">
                <button type="button" class="btn btn-outline-dark">edit profile</button>
                <button type="button" class="btn btn-outline-primary">history</button>
                <button type="button" class="btn btn-outline-danger">logout</button>
            </div>
        </div>

        <!--departments-->
        <div class="d-flex align-items-center justify-content-between mt-4">
            <h5>Departments</h5>
        </div>

        <!--departments list-->
        <div class="card mt-3 p-2">
        <!--connect thru jinja later so we dontn have to hardcode and can go thru the departments assigned for each patient-->
            <div class="d-flex align-items-center justify-content-between mt-2" style="border: 2px solid black; border-radius: 6px; padding: 10px;">
                <h6>Cardiology</h6>
                <div class="d-flex gap-2"> <!--gap gives space b/w buttons-->
                    <button type="button" class="btn btn-primary" href="#">View details</button> <!--open dept page-->
                </div>
            </div>

        </div>

        <!--upcoming appointments-->
        <h5 class="mt-4">Upcoming Appointments</h5>
        <div class="table-responsive mt-4">
            <table class="table" style="border: 2px solid black; border-radius: 6px;">
                <thead>
                    <tr>
                        <th>Sr.No.</th>
                        <th>Doctor Name</th>
                        <th>Department</th>
                        <th>Date</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <!--sample row until backend-->
                <tbody>
                    <td>10004</td>
                    <td>beedpejej</td>
                    <td>general</td>
                    <td>9/11</td>
                    <td>
                        8 am-10 am
                        <button type="button" class="btn btn-danger">cancel</button>
                    </td>
                </tbody>
            </table>
        </div>




    </div>


</body>
</html>
