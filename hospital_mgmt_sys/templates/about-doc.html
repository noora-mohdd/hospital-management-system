<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About the doctor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="width: 35rem; background-color: #e3fcf9">
        <h3 class="fw-bold">{{doctor.full_name}} </h3>
        <p class="mt-2"><strong>{{doctor.specialization}}</strong> </p>
        <p><strong>{{doctor.experience}} years experience</strong> </p>
        <hr>
        <p>this doctor has extensive experience and is dedicated to providing high quality care</p>
        <div class="mt-4 d-flex justify-content-between">
            <a href="{{ url_for('patient.doctor_availability', doctor_id=doctor.id )}}" class="btn btn-primary"> check availability</a>
            <button class="btn-outline-secondary"> go back </button>
        </div>
    </div>
<body>
    
</body>
</html>
