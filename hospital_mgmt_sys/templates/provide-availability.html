<!DOCTYPE html>
<html lang="en">

<head>
    <title>Provide availability</title>
    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4 shadow" style="width: 30rem; background-color: #e3fcf9">
        <h3 class="text-center mb-3">Provide Availability</h3>

        {% with messages=get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissable fade show d-flex justify-content-between align-items-center">
                        <span>{{ message }} </span> 
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"></script>

        <form action="{{ url_for('doctor.provide_availability') }}" method="POST">

            <!--select date-->
            <div class="mb-3">
                <label class="form-label">date</label>
                <input type="date" name="date" class="form-control" required>
            </div>
            <!--select time-->
            <div class="mb-3">
                <label class="form-label">Time</label>
                <input type="time" name="time" class="form-control" required>
            </div>

            <div class="text-center">
                <button class="btn btn-success">add availability</button>
            </div>

        </form>
    
    </div>
</body>
</html>
