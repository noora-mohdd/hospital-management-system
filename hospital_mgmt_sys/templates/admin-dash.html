<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/hospital_mgmt_sys/static/style.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
    
    <div class="card p-4 shadow" style="background-color: #e3fcf9; width: 1000px;">

        <!--welcome admin part from wireframe-->
        <nav class="navbar px-0">
            <div class="d-flex align-items-center w-100 justify-content-between">

                <a class="navbar-brand text-dark fw-bold">Welcome Admin</a>

                <form class="d-flex" method="get" action="#"> <!--link here w jinja where data should be sent-->
                    <input class="form-control me-2" type="search" placeholder="search doctor" aria-label="Search">
                    <button class="btn btn-success" type="submit">Search</button>
                </form>

            </div>
        </nav>

        <!--reg doc from wireframe-->
        <div class="d-flex align-items-center justify-content-between mt-4">
            <h5>Registered Doctors</h5>
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button href="#" class="btn btn-outline-success">Create</button>
            </div>
        </div>

        <!--registered doc list-->
        <div class="card mt-3 p-2">

            <!--doctor row-->
            <!--connect thru jinja later so we dontn have to hardcode and can go thru the docs admin registered from db-->
            <div class="d-flex align-items-center justify-content-between mt-2" style="border: 2px solid black; border-radius: 6px; padding: 10px;">
                <h6>Dr. BADABING</h6>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-warning" href="#">Edit</button>  <!--should take to edit form (similar to add doc form it is)-->
                    <button type="button" class="btn btn-outline-danger">Delete</button>
                    <button type="button" class="btn btn-outline-dark">Blacklist</button>
                </div>
            </div>

            <div class="d-flex align-items-center justify-content-between mt-2" style="border: 2px solid black; border-radius: 6px; padding: 10px;">
                <h6>Dr. BADABOOM</h6>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-warning" href="#">Edit</button>  <!--should take to edit form (similar to add doc form it is)-->
                    <button type="button" class="btn btn-outline-danger">Delete</button>
                    <button type="button" class="btn btn-outline-dark">Blacklist</button>
                </div>
            </div>

            <!--end jinja here-->
        </div>

        
        <!--registered patients ffrom wirefram-->
        <div class="d-flex align-items-center justify-content-between mt-4">
            <h5>Registered Patients</h5>
        </div>

        <!--registered patient list-->
        <div class="card mt-3 p-2">

            <!--patient row-->
        <!--connect thru jinja later so we dontn have to hardcode and can go thru the docs admin registered from db-->
            <div class="d-flex align-items-center justify-content-between mt-2" style="border: 2px solid black; border-radius: 6px; padding: 10px;">
                <h6>Ms. DUMBFUKS</h6>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-warning" href="#">Edit</button>  <!--patient edit form ig-->
                    <button type="button" class="btn btn-outline-danger">Delete</button>
                    <button type="button" class="btn btn-outline-dark">Blacklist</button>
                </div>
            </div>

        </div>

        <!--upcoming appointments table-->
        <h5 class="mt-4">Upcoming Appointments</h5>
        <div class="table-responsive mt-4">
            <table class="table" style="border: 2px solid black; border-radius: 6px;">
                <thead>
                    <tr>
                        <th>Sr.No.</th>
                        <th>Patient Name</th>
                        <th>Doctor Name</th>
                        <th>Department</th>
                        <th>Patient History</th>
                    </tr>
                </thead>
                <!--sample row until backend-->
                <tbody>
                    <td>--</td>
                    <td>--</td>
                    <td>--</td>
                    <td>--</td>
                    <td><button type="button" class="btn btn-primary">View</button></td>
                </tbody>
            </table>
        </div>

    
    </div>
</body>
</html>
