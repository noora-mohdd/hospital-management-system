<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor availability</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="d-flex justify-content-center align-items-center vh-100">
    
    <div class="card p-4 shadow" style="background-color: #e3fcf9; width: 1000px;">
        <h3 class="fw-bold mb-3">Doctor's availability</h3>
        <h5>{{doctor.full_name}} ({{doctor.specialization}} yrs) </h5>
        <div class="table-responsive mt-4">
            <table class="table" style="border: 2px solid black; border-radius: 6px;">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Morning slot</th>
                        <th>Evening slot</th>
                    </tr>
                </thead>
                <tbody>
                    {% for day in availability %}
                    <tr>
                        <td>{{ day.date }} </td>

                        <td>{% if day.slots %}
                                {% for slot in day.slots %}
                                    <a href="{{ url_for('patient.book',doctor_id=doctor.id, date=day.date, time=slot)}}"
                                    class="btn btn-outline-success m-1"> {{ slot }} </a>
                                {% endfor %}
                            {% else %}
                                <button class="btn btn-outline-danger btn-lg">not available</button> 
                            {% endif %}
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
                    
</body>
</html>
