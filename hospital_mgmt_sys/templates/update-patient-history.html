<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/hospital_mgmt_sys/static/style.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
    
    <div class="card p-4 shadow" style="background-color: #e3fcf9; width: 1000px;">

        <h4 class="fw-bold">Update patient history</h4>

        <!--patient basic details, link w jinja later from db-->
        <p class="mt-2 mb-1"><strong>Patient name:</strong> Ms.beeboo</p>
        <p class="mb-1"><strong>Doctor name:</strong> Dr. BADABOOM</p>
        <p class="mb-1"><strong>Department:</strong> somethingsomthing</p>

        <!--form start-->
        <form method="post" action="#">

            <div class="row mb-3 mt-4">
                <div class="col">
                    <label class="label-title">Visit type</label>
                    <input type="text" name="visit_type" class="form-control" placeholder="eg. in-person">
                </div>
                <div class="col">
                    <label class="label-title">Test done</label>
                    <input type="text" name="test_done" class="form-control" placeholder="eg. ECG">
                </div>
            </div>

            <div class="mb-3">
                <label class="label-title">Diagnosis</label>
                <input type="text" class="form-control" name="diagnosis" placeholder="enter diagnosis">
            </div>

            <div class="row">
                    <div class="col">
                    <label class="label-title">prescription</label>
                    <input type="text" name="perscription" class="form-control" placeholder="enter perscription">
                </div>
                <div class="col">
                    <label class="label-title">Medicine</label>
                    <input type="text" name="medicine" class="form-control" placeholder="name, dose, frequency">
                </div>
            </div>

        </form>
        <div class="text-end mt-3">
            <button type="submit" class="btn btn-success">Save</button>
        </div>

    </div>
</body>
</html>
