<!DOCTYPE html>
<html lang="en">

<head>
    <title>Registration</title>
    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!--link w jinja2 here--> <!--ig base.html??-->
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4 shadow" style="width: 30rem; background-color: #e3fcf9">
        <h2 class="text-center mb-4">SIGN UP</h2>
        <form action="{{url_for('patient.register')}}", method="post">

            <!--email collect-->
             <div class="mb-3">
                <label class="form-label">E-mail ID</label> <br>
                <input type="text" class="form-control" name="email" placeholder="type valid E-mail">
            </div>

            <!--age-->
             <div class="mb-3">
                <label class="form-label">Age</label> <br>
                <input type="number" class="form-control" name="age" placeholder="type valid E-mail">
            </div>

            <!--full name-->
             <div class="mb-3">
                <label class="form-label">Full name</label> <br>
                <input type="text" class="form-control" name="full_name" placeholder="type full name">
            </div>

            <!--username-->
            <div class="mb-3">
                <label class="form-label">Username</label> <br>
                <input type="text" class="form-control" name="username" placeholder="type username">
            </div>

            <!--password-->
            <div class="mb-3">
                <label class="form-label">Password</label> <br>
                <input type="password" class="form-control" name="password" placeholder="type password">
            </div>

            <div class="text-center">
                <input type="submit" class="btn btn-primary w-100 mt-3" value="Sign up"> <br>
                <p class="mt-3">existing user? <a href="{{url_for('patient.login')}}">log in</a></p>
            </div>
            </form>
        </div>
    </div>
</body>
</html>
